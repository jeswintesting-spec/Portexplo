<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1628"/>
      <stop offset="100%" stop-color="#060e1c"/>
    </linearGradient>
    <!-- Cyan glow filter -->
    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <!-- Subtle drop shadow for P -->
    <filter id="pShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="rgba(0,0,0,0.6)"/>
    </filter>
  </defs>

  <!-- Rounded square background -->
  <rect width="100" height="100" rx="22" ry="22" fill="url(#bgGrad)"/>

  <!-- Subtle inner border glow -->
  <rect width="100" height="100" rx="22" ry="22"
        fill="none"
        stroke="rgba(0, 200, 255, 0.12)"
        stroke-width="1.5"/>

  <!-- Letter P — bold, white, slightly left of center -->
  <text
    x="30"
    y="76"
    font-family="'Arial Black', 'Helvetica Neue', Arial, sans-serif"
    font-weight="900"
    font-size="62"
    fill="white"
    filter="url(#pShadow)"
    letter-spacing="-2"
  >P</text>

  <!-- Signal arc 1 (smallest — innermost) -->
  <path
    d="M 61 44 A 9 9 0 0 1 70 35"
    fill="none"
    stroke="#00f2fe"
    stroke-width="4"
    stroke-linecap="round"
    opacity="1"
    filter="url(#cyanGlow)"
  />

  <!-- Signal arc 2 (medium) -->
  <path
    d="M 61 35 A 18 18 0 0 1 79 17"
    fill="none"
    stroke="#00f2fe"
    stroke-width="3.5"
    stroke-linecap="round"
    opacity="0.8"
    filter="url(#cyanGlow)"
  />

  <!-- Signal arc 3 (largest — outermost) -->
  <path
    d="M 61 26 A 27 27 0 0 1 88 -1"
    fill="none"
    stroke="#00f2fe"
    stroke-width="3"
    stroke-linecap="round"
    opacity="0.55"
    filter="url(#cyanGlow)"
  />

  <!-- Dot at signal origin -->
  <circle cx="61" cy="53" r="3.5" fill="#00f2fe" filter="url(#cyanGlow)"/>
</svg>